# dipstick.earth :443 — the whole site, marketing pages included, served by
# the Django app in /home/japhy/stickerSheet.dipstick.earth.
#
# The static pages used to be files under DocumentRoot here. They are Django
# templates now, so there is no DocumentRoot at all: everything except
# /static/ and /media/ goes to the app.
#
# mod_wsgi on this box links libpython3.8, so python-home must be the 3.8 venv.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dipstick.earth
    ServerAlias www.dipstick.earth
    ServerAdmin alex@alexhornstein.com

    # This box runs ~14 Django apps under mod_wsgi on 3.8 GB of RAM, and each
    # daemon process holds ~140 MB once Django and Pillow are imported. So one
    # process, not two: at this site's traffic (tens of requests a minute) a
    # single process with 12 threads is not remotely the bottleneck, and the
    # second one costs as much memory as the first.
    #
    # display-name makes the daemon identifiable in `ps` — without it every
    # daemon shows up as plain "apache2 -k start" and you cannot tell which
    # app is eating the memory.
    #
    # maximum-requests recycles the process periodically so a slow leak (or
    # Pillow holding a big image) cannot grow without bound.
    # inactivity-timeout lets it hand memory back when nobody is visiting.
    WSGIDaemonProcess dipstick.earth \
        python-home=/home/japhy/stickerSheet.dipstick.earth/.venv \
        python-path=/home/japhy/stickerSheet.dipstick.earth \
        processes=1 threads=12 \
        maximum-requests=500 inactivity-timeout=600 \
        display-name=%{GROUP}
    WSGIProcessGroup dipstick.earth

    # REQUIRED for the app API. mod_wsgi drops the Authorization header by
    # default, on the assumption that Apache is doing the authenticating —
    # so DRF never sees "Authorization: Token ...", every app request arrives
    # anonymous, and a staff token silently fails to skip the review queue
    # with no error anywhere. Nothing in Django can compensate for this.
    WSGIPassAuthorization On
    WSGIScriptAlias / /home/japhy/stickerSheet.dipstick.earth/stickersheet/wsgi.py

    <Directory /home/japhy/stickerSheet.dipstick.earth/stickersheet>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /home/japhy/stickerSheet.dipstick.earth/staticfiles/
    <Directory /home/japhy/stickerSheet.dipstick.earth/staticfiles>
        Require all granted
        Options -Indexes

        # This server's mime.types predates WebP and does not know woff2
        # either. The old site fixed that with an .htaccess in its DocumentRoot
        # — there is no DocumentRoot any more, so the types are declared here.
        # Without this the marketing page's .webp images are served with no
        # Content-Type at all.
        AddType image/webp .webp
        AddType font/woff2 .woff2
        AddType font/woff  .woff
        AddType image/svg+xml .svg

        # Hashed or not, these are cheap to re-fetch and Cloudflare fronts them.
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    Alias /media/ /home/japhy/stickerSheet.dipstick.earth/media/
    <Directory /home/japhy/stickerSheet.dipstick.earth/media>
        Require all granted
        Header set Cache-Control "public, max-age=2592000, immutable"

        # Defence in depth for a directory the public can write to. mod_php8.3
        # is enabled SERVER-WIDE, so without engine-off a .php that got past
        # the form's extension check would execute.
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .cgi .pl .py
        AddType text/plain .html .htm .shtml .php .phtml .cgi .pl .py .svg
        Header set X-Content-Type-Options "nosniff"
        Options -ExecCGI -Indexes
    </Directory>

    # The submit form caps uploads at 64 MB. Note Cloudflare's own body limit
    # sits in front of this on the proxied record.
    LimitRequestBody 70000000

    SSLCertificateFile /etc/letsencrypt/live/dipstick.earth/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dipstick.earth/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    LogLevel info
    ErrorLog  /home/japhy/logs/dipstick.earth-error.log
    CustomLog /home/japhy/logs/dipstick.earth-access.log combined
</VirtualHost>
</IfModule>
