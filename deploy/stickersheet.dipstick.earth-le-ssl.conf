# Port 443 — the Django app under mod_wsgi, plus static and media.
#
# mod_wsgi on this box links libpython3.8, so python-home MUST point at a
# Python 3.8 venv. See CLAUDE.md.
#
# Nothing here needs a separate service: the daemon process is started by
# apache itself, so a reboot brings the site back with apache.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName stickersheet.dipstick.earth
    ServerAdmin alex@alexhornstein.com

    WSGIDaemonProcess stickersheet.dipstick.earth \
        python-home=/home/japhy/stickerSheet.dipstick.earth/.venv \
        python-path=/home/japhy/stickerSheet.dipstick.earth \
        processes=2 threads=8
    WSGIProcessGroup stickersheet.dipstick.earth
    WSGIScriptAlias / /home/japhy/stickerSheet.dipstick.earth/stickersheet/wsgi.py

    <Directory /home/japhy/stickerSheet.dipstick.earth/stickersheet>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /home/japhy/stickerSheet.dipstick.earth/staticfiles/
    <Directory /home/japhy/stickerSheet.dipstick.earth/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /home/japhy/stickerSheet.dipstick.earth/media/
    <Directory /home/japhy/stickerSheet.dipstick.earth/media>
        Require all granted

        # Uploads are effectively immutable (Django suffixes on collision), so
        # let the browser hold on to them. The sheet re-requests a lot of
        # thumbnails as people scroll back and forth.
        Header set Cache-Control "public, max-age=2592000, immutable"

        # Everything below is defence in depth for a world-writable-by-upload
        # directory. mod_php8.3 is enabled SERVER-WIDE on this box, so without
        # the engine-off a .php that slipped past the form's extension check
        # would execute. The form only accepts image/video extensions; this is
        # the second lock, not the first.
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .cgi .pl .py
        AddType text/plain .html .htm .shtml .php .phtml .cgi .pl .py .svg
        Header set X-Content-Type-Options "nosniff"
        Options -ExecCGI -Indexes
    </Directory>

    # A dipstick video off a phone can be large; the form caps at 64 MB.
    LimitRequestBody 70000000

    SSLCertificateFile /etc/letsencrypt/live/stickersheet.dipstick.earth/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stickersheet.dipstick.earth/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    LogLevel info
    ErrorLog  /home/japhy/logs/stickersheet.dipstick.earth-error.log
    CustomLog /home/japhy/logs/stickersheet.dipstick.earth-access.log combined
</VirtualHost>
</IfModule>
