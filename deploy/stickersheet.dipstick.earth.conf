# Port 80 — redirect to HTTPS, and nothing else.
#
# Deliberately holds NO WSGI config. certbot's --apache plugin clones this
# vhost into the SSL one; if WSGIDaemonProcess lived here we would end up with
# two daemons of the same name and mod_wsgi refuses to start. All the app
# config lives in stickersheet.dipstick.earth-le-ssl.conf.

<VirtualHost *:80>
    ServerName stickersheet.dipstick.earth
    ServerAdmin alex@alexhornstein.com

    # Let certbot answer the ACME http-01 challenge over plain HTTP. Without
    # this exclusion the rule below bounces the challenge to an https URL that
    # does not work yet, and issuance fails on a first run.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =stickersheet.dipstick.earth
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    LogLevel info
    ErrorLog  /home/japhy/logs/stickersheet.dipstick.earth-error.log
    CustomLog /home/japhy/logs/stickersheet.dipstick.earth-access.log combined
</VirtualHost>
