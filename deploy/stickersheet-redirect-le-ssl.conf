# stickersheet.dipstick.earth :443 — nothing but a 301 to the merged site.
#
# Every sticker link ever shared points at this host, and dipstick.earth's own
# pages linked here from 5 places, so it has to keep resolving. The old root
# was the sheet, which now lives at /gallery/.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName stickersheet.dipstick.earth
    ServerAdmin alex@alexhornstein.com

    RewriteEngine on
    # the old front page -> the gallery
    RewriteRule ^/?$ https://dipstick.earth/dipstickers/ [END,NE,R=permanent]
    # /sticker/<slug>/, /species/<slug>/, /submit/ all moved under /gallery/
    RewriteRule ^/(sticker|species|submit)(/.*)?$ https://dipstick.earth/dipstickers/$1$2 [END,NE,R=permanent]
    # everything else keeps its path
    RewriteRule ^(.*)$ https://dipstick.earth$1 [END,NE,R=permanent]

    SSLCertificateFile /etc/letsencrypt/live/stickersheet.dipstick.earth/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stickersheet.dipstick.earth/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    LogLevel info
    ErrorLog  /home/japhy/logs/stickersheet.dipstick.earth-error.log
    CustomLog /home/japhy/logs/stickersheet.dipstick.earth-access.log combined
</VirtualHost>
</IfModule>
